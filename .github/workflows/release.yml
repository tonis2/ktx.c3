# On every v* tag: rebuild all native libs (via build-zstd.yml) and attach
# them to the tag's GitHub release as raw files — no archives — so consumers
# can fetch a single lib directly, e.g. the Blender glTF addon downloading
# only the library matching the user's OS:
#   https://github.com/<repo>/releases/latest/download/ktx-<triple>.<ext>
#
# Asset names embed the target triple because release assets share one flat
# namespace (two platforms both produce a "ktx.so"/"ktx.dylib"):
#   ktx-<triple>.{so,dylib,dll}  ktx-windows-x64.lib (import lib)
#   libzstd-<triple>.a           zstd-windows-x64.lib
#   ktx-cli-<triple>[.exe]       standalone CLI binaries
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-zstd.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename assets to <name>-<triple>.<ext>
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")               # libzstd-<triple> | libktx-<triple> | ktxcli-<triple>
            triple=${name#libzstd-}; triple=${triple#libktx-}; triple=${triple#ktxcli-}
            for f in "$dir"*; do
              base=$(basename "$f")               # e.g. ktx.dylib, libzstd.a, ktx-cli-<triple>
              if [[ "$base" == *"$triple"* ]]; then
                cp "$f" "release/$base"           # already carries the triple (CLI binaries)
              else
                cp "$f" "release/${base%.*}-${triple}.${base##*.}"
              fi
            done
          done
          ls -l release/
      - name: Create release and attach libs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          # --clobber so re-pushing a tag (or re-running the job) refreshes assets.
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
