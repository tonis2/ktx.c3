# Builds the native artifacts every platform needs and uploads them as run
# artifacts. release.yml calls this workflow on version tags and attaches the
# same artifacts to the GitHub release (raw files, uniquely named):
#   - libzstd.a / zstd.lib — the bundled zstd static lib (the library's only
#     native dependency since the pure-C3 basis rewrite), linked by the
#     ktx.c3l manifest.
#   - ktx.so / ktx.dylib / ktx.dll — the libktx shared library (C API in
#     src/capi) for FFI consumers, e.g. the Blender glTF exporter addon.
#
# zstd is NOT vendored; each runner fetches the pinned release tarball via
# native/build-zstd.sh. c3c is installed from its release archives. There is
# no linux-aarch64 or x86_64 macOS c3c release binary: linux-aarch64 gets no
# shared lib for now, and the macos-x64 dylib is cross-compiled from the arm64
# runner.
name: build-native

env:
  C3C_RELEASE: v0.8.2

on:
  workflow_dispatch:
  workflow_call:      # release.yml reuses the whole build matrix on v* tags
  push:
    paths:
      - native/build-zstd.sh
      - native/build-shared.sh
      - src/ktx/**
      - src/capi/**
      - .github/workflows/build-zstd.yml

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         triple: macos-aarch64, c3c: c3-macos.zip }
          - { os: ubuntu-latest,    triple: linux-x64,     c3c: c3-linux.tar.gz }
          - { os: ubuntu-24.04-arm, triple: linux-aarch64 }           # no linux-aarch64 c3c release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4          # no submodules: the script fetches zstd
      - name: Build libzstd.a
        run: ./native/build-zstd.sh ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: libzstd-${{ matrix.triple }}
          path: lib/${{ matrix.triple }}/libzstd.a
          if-no-files-found: error

      - name: Install c3c
        if: matrix.c3c
        run: |
          curl -fsSL -o /tmp/c3c-dist "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/${{ matrix.c3c }}"
          case "${{ matrix.c3c }}" in
            *.zip) unzip -q /tmp/c3c-dist -d "$HOME" ;;   # both archives hold a top-level c3/
            *)     tar -xzf /tmp/c3c-dist -C "$HOME" ;;
          esac
          echo "$HOME/c3" >> "$GITHUB_PATH"
      - name: Build libktx shared library
        if: matrix.c3c
        run: ./native/build-shared.sh ${{ matrix.triple }}
      - name: Smoke-test the C API
        if: matrix.c3c
        run: python3 test/capi_smoke.py ${{ matrix.triple }}/ktx.*
      - uses: actions/upload-artifact@v4
        if: matrix.c3c
        with:
          name: libktx-${{ matrix.triple }}
          path: ${{ matrix.triple }}/ktx.*
          if-no-files-found: error

  # Intel macOS runners (macos-13) are retired and c3c ships no x86_64 mac
  # binary, so the whole macos-x64 target is cross-compiled from arm64:
  # build-zstd.sh pins -arch and build-shared.sh passes --target. No smoke
  # test: the runner can't execute x64 natively.
  macos-x64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build libzstd.a (x86_64 cross)
        run: ./native/build-zstd.sh macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: libzstd-macos-x64
          path: lib/macos-x64/libzstd.a
          if-no-files-found: error
      - name: Install c3c
        run: |
          curl -fsSL -o /tmp/c3-macos.zip "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/c3-macos.zip"
          unzip -q /tmp/c3-macos.zip -d "$HOME"
          echo "$HOME/c3" >> "$GITHUB_PATH"
      - name: Cross-build ktx.dylib (x86_64)
        run: ./native/build-shared.sh macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: libktx-macos-x64
          path: macos-x64/ktx.dylib
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Puts cl/lib on PATH (vcvarsall); bash steps don't get the MSVC env otherwise.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build zstd.lib (MSVC)
        shell: bash
        run: |
          set -euo pipefail
          # Pinned version is the single source of truth in the build script.
          VERSION=$(grep -oE 'ZSTD_VERSION="[0-9.]+"' native/build-zstd.sh | cut -d'"' -f2)
          # Extract only lib/ — the tarball's tests/ contains symlinks that
          # Windows tar cannot create (exit 2 under pipefail).
          curl -fsSL "https://github.com/facebook/zstd/releases/download/v$VERSION/zstd-$VERSION.tar.gz" | tar xz -C native "zstd-$VERSION/lib"
          SRC="native/zstd-$VERSION"
          mkdir -p native/build-zstd windows-x64 lib/windows-x64
          # MSVC options in dash form: git-bash mangles //X:... arguments.
          cl -nologo -O2 -MD -DZSTD_DISABLE_ASM -DZSTD_MULTITHREAD=0 \
            -I "$SRC/lib" -I "$SRC/lib/common" \
            -c "$SRC"/lib/common/*.c "$SRC"/lib/compress/*.c "$SRC"/lib/decompress/*.c \
            -Fonative/build-zstd/
          lib -nologo "-OUT:lib/windows-x64/zstd.lib" native/build-zstd/*.obj
          test -f lib/windows-x64/zstd.lib
      - uses: actions/upload-artifact@v4
        with:
          name: libzstd-windows-x64
          path: lib/windows-x64/zstd.lib
          if-no-files-found: error

      - name: Install c3c
        shell: bash
        run: |
          curl -fsSL -o c3-windows.zip "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/c3-windows.zip"
          unzip -q c3-windows.zip -d "$HOME"
          echo "$(cygpath -w "$HOME/c3")" >> "$GITHUB_PATH"
      - name: Build ktx.dll
        shell: bash
        run: |
          ls -la windows-x64/
          # c3c's -L/-l don't reach lld-link as /libpath:, and lld-link runs
          # from its own cwd — pass a Windows-style absolute path expanded by
          # the runner itself (cygpath output risks a stray \r in the arg).
          # -vv prints the linker invocation for diagnosis.
          c3c dynamic-lib src/ktx/*.c3 src/capi/*.c3 -O2 --no-headers -vv \
            -z '${{ github.workspace }}\lib\windows-x64\zstd.lib' -o windows-x64/ktx
      - name: Smoke-test the C API
        shell: bash
        run: python test/capi_smoke.py windows-x64/ktx.dll
      - uses: actions/upload-artifact@v4
        with:
          name: libktx-windows-x64
          path: |
            windows-x64/ktx.dll
            windows-x64/ktx.lib
          if-no-files-found: error
