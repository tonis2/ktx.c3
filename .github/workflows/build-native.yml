# Builds the native artifacts every platform needs and uploads them as run
# artifacts. release.yml calls this workflow on version tags and attaches the
# same artifacts to the GitHub release (raw files, uniquely named):
#   - ktx.so / ktx.dylib / ktx.dll — the libktx shared library (C API in
#     src/capi) for FFI consumers, e.g. the Blender glTF exporter addon.
#   - ktx-cli-<triple>[.exe] — the standalone ktx CLI (create/extract/info),
#     ready to download and run.
#
# zstd — the library's only native dependency since the pure-C3 basis rewrite —
# is NOT built here: lib/<triple>/{libzstd.a,zstd.lib} are committed and are
# what the ktx.c3l manifest links, so linking them here builds exactly what
# consumers get. Rebuilding them is a separate manual job (zstd.yml).
#
# c3c is installed from its release archives. There is no linux-aarch64 or
# x86_64 macOS c3c release binary: linux-aarch64 gets no build for now, and the
# macos-x64 artifacts are cross-compiled from the arm64 runner.
name: build-native

env:
  C3C_RELEASE: v0.8.2

on:
  workflow_dispatch:
  workflow_call:      # release.yml reuses the whole build matrix on v* tags
  push:
    paths:
      - native/build-shared.sh
      - src/ktx/**
      - src/capi/**
      - lib/*/libzstd.a
      - lib/*/zstd.lib
      - .github/workflows/build-native.yml

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      triple: macos-aarch64, c3c: c3-macos.zip,    cli: ktx }
          - { os: ubuntu-latest, triple: linux-x64,     c3c: c3-linux.tar.gz, cli: ktx-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive            # getopt.c3l + image.c3l for the CLI build
      - name: Install c3c
        run: |
          curl -fsSL -o /tmp/c3c-dist "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/${{ matrix.c3c }}"
          case "${{ matrix.c3c }}" in
            *.zip) unzip -q /tmp/c3c-dist -d "$HOME" ;;   # both archives hold a top-level c3/
            *)     tar -xzf /tmp/c3c-dist -C "$HOME" ;;
          esac
          echo "$HOME/c3" >> "$GITHUB_PATH"
      - name: Build libktx shared library
        run: ./native/build-shared.sh ${{ matrix.triple }}
      - name: Smoke-test the C API
        run: python3 test/capi_smoke.py ${{ matrix.triple }}/ktx.*
      - uses: actions/upload-artifact@v4
        with:
          name: libktx-${{ matrix.triple }}
          path: ${{ matrix.triple }}/ktx.*
          if-no-files-found: error

      - name: Build the ktx CLI
        run: |
          c3c build ${{ matrix.cli }} -O2
          mv "build/${{ matrix.cli }}" "build/ktx-cli-${{ matrix.triple }}"
      - name: Smoke-test the CLI
        run: |
          ./build/ktx-cli-${{ matrix.triple }} create -f etc1s -o /tmp/cli-smoke.ktx2 test/images/detail.png
          ./build/ktx-cli-${{ matrix.triple }} info /tmp/cli-smoke.ktx2
      - uses: actions/upload-artifact@v4
        with:
          name: ktxcli-${{ matrix.triple }}
          path: build/ktx-cli-${{ matrix.triple }}
          if-no-files-found: error

  # Intel macOS runners (macos-13) are retired and c3c ships no x86_64 mac
  # binary, so the whole macos-x64 target is cross-compiled from arm64:
  # build-shared.sh passes --target and the committed lib/macos-x64/libzstd.a
  # is already an x86_64 archive. No smoke test: the runner can't execute x64.
  macos-x64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install c3c
        run: |
          curl -fsSL -o /tmp/c3-macos.zip "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/c3-macos.zip"
          unzip -q /tmp/c3-macos.zip -d "$HOME"
          echo "$HOME/c3" >> "$GITHUB_PATH"
      - name: Cross-build ktx.dylib (x86_64)
        run: ./native/build-shared.sh macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: libktx-macos-x64
          path: macos-x64/ktx.dylib
          if-no-files-found: error
      - name: Cross-build the ktx CLI (x86_64)
        run: |
          c3c build ktx-macos-x64 --target macos-x64 -O2
          mv build/ktx-macos-x64 build/ktx-cli-macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ktxcli-macos-x64
          path: build/ktx-cli-macos-x64
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install c3c
        shell: bash
        run: |
          curl -fsSL -o c3-windows.zip "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/c3-windows.zip"
          unzip -q c3-windows.zip -d "$HOME"
          echo "$(cygpath -w "$HOME/c3")" >> "$GITHUB_PATH"
      - name: Build ktx.dll
        shell: bash
        run: |
          # c3c's -L/-l don't reach lld-link as /libpath:, and lld-link runs
          # from its own cwd — pass a Windows-style absolute path expanded by
          # the runner itself (cygpath output risks a stray \r in the arg).
          # -vv prints the linker invocation for diagnosis.
          c3c dynamic-lib src/ktx/*.c3 src/capi/*.c3 -O2 --no-headers -vv \
            -z '${{ github.workspace }}\lib\windows-x64\zstd.lib' -o windows-x64/ktx
      - name: Smoke-test the C API
        shell: bash
        run: python test/capi_smoke.py windows-x64/ktx.dll
      - uses: actions/upload-artifact@v4
        with:
          name: libktx-windows-x64
          path: |
            windows-x64/ktx.dll
            windows-x64/ktx.lib
          if-no-files-found: error

      - name: Build the ktx CLI
        shell: bash
        run: |
          # zstd.lib passed like the ktx.dll link above: absolute Windows path
          # via -z, because -L/-l never reach lld-link as /libpath:.
          c3c build ktx-windows -O2 -z '${{ github.workspace }}\lib\windows-x64\zstd.lib'
          mv build/ktx-windows.exe build/ktx-cli-windows-x64.exe
      - name: Smoke-test the CLI
        shell: bash
        run: |
          ./build/ktx-cli-windows-x64.exe create -f etc1s -o cli-smoke.ktx2 test/images/detail.png
          ./build/ktx-cli-windows-x64.exe info cli-smoke.ktx2
      - uses: actions/upload-artifact@v4
        with:
          name: ktxcli-windows-x64
          path: build/ktx-cli-windows-x64.exe
          if-no-files-found: error
