# Builds the native artifacts every platform needs and uploads them as run
# artifacts. release.yml calls this workflow on version tags and attaches the
# same artifacts to the GitHub release (raw files, uniquely named):
#   - libbasisu.a / basisu.lib — bundled basis_universal static lib, linked by
#     the ktx.c3l manifest so consumers get ETC1S/BasisLZ without a C++ build.
#   - ktx.so / ktx.dylib / ktx.dll — the libktx shared library (C API in
#     src/capi) for FFI consumers, e.g. the Blender glTF exporter addon.
#
# basis_universal is NOT a submodule of this repo (it's large and only needed
# here); each runner fetches it at the pinned commit via native/build-basisu.sh.
# c3c is installed from its release archives. There is no linux-aarch64 or
# x86_64 macOS c3c release binary: linux-aarch64 gets no shared lib for now,
# and the macos-x64 dylib is cross-compiled from the arm64 runner.
name: build-native

env:
  C3C_RELEASE: v0.8.2

on:
  workflow_dispatch:
  workflow_call:      # release.yml reuses the whole build matrix on v* tags
  push:
    paths:
      - native/build-basisu.sh
      - native/build-shared.sh
      - src/ktx/**
      - src/capi/**
      - .github/workflows/build-basisu.yml

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         triple: macos-aarch64, c3c: c3-macos.zip }
          - { os: ubuntu-latest,    triple: linux-x64,     c3c: c3-linux.tar.gz }
          - { os: ubuntu-24.04-arm, triple: linux-aarch64 }           # no linux-aarch64 c3c release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4          # no submodules: the script fetches basis
      - name: Build libbasisu.a
        run: ./native/build-basisu.sh ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: libbasisu-${{ matrix.triple }}
          path: ${{ matrix.triple }}/libbasisu.a
          if-no-files-found: error

      - name: Install c3c
        if: matrix.c3c
        run: |
          curl -fsSL -o /tmp/c3c-dist "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/${{ matrix.c3c }}"
          case "${{ matrix.c3c }}" in
            *.zip) unzip -q /tmp/c3c-dist -d "$HOME" ;;   # both archives hold a top-level c3/
            *)     tar -xzf /tmp/c3c-dist -C "$HOME" ;;
          esac
          echo "$HOME/c3" >> "$GITHUB_PATH"
      - name: Build libktx shared library
        if: matrix.c3c
        run: ./native/build-shared.sh ${{ matrix.triple }}
      - name: Smoke-test the C API
        if: matrix.c3c
        run: python3 test/capi_smoke.py ${{ matrix.triple }}/ktx.*
      - uses: actions/upload-artifact@v4
        if: matrix.c3c
        with:
          name: libktx-${{ matrix.triple }}
          path: ${{ matrix.triple }}/ktx.*
          if-no-files-found: error

  # Intel macOS runners (macos-13) are retired and c3c ships no x86_64 mac
  # binary, so the whole macos-x64 target is cross-compiled from arm64:
  # build-basisu.sh pins CMAKE_OSX_ARCHITECTURES/-arch and build-shared.sh
  # passes --target. No smoke test: the runner can't execute x64 natively.
  macos-x64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build libbasisu.a (x86_64 cross)
        run: ./native/build-basisu.sh macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: libbasisu-macos-x64
          path: macos-x64/libbasisu.a
          if-no-files-found: error
      - name: Install c3c
        run: |
          curl -fsSL -o /tmp/c3-macos.zip "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/c3-macos.zip"
          unzip -q /tmp/c3-macos.zip -d "$HOME"
          echo "$HOME/c3" >> "$GITHUB_PATH"
      - name: Cross-build ktx.dylib (x86_64)
        run: ./native/build-shared.sh macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: libktx-macos-x64
          path: macos-x64/ktx.dylib
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Puts cl/lib on PATH (vcvarsall); bash steps don't get the MSVC env otherwise.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build basisu.lib (MSVC)
        shell: bash
        run: |
          set -euo pipefail
          # Pinned commit is the single source of truth in the build script.
          COMMIT=$(grep -oE 'BASIS_COMMIT="[0-9a-f]+"' native/build-basisu.sh | cut -d'"' -f2)
          SRC=native/basis_universal
          git clone --filter=blob:none https://github.com/BinomialLLC/basis_universal.git "$SRC"
          git -C "$SRC" fetch --depth 1 origin "$COMMIT"
          git -C "$SRC" checkout -q "$COMMIT"
          cmake -S "$SRC" -B native/build \
            -DCMAKE_BUILD_TYPE=Release -DBASISU_EXAMPLES=OFF -DBASISU_OPENCL=OFF -DBASISU_STATIC=ON
          cmake --build native/build --target basisu_encoder --config Release
          # Compile the two C-API wrappers and merge into basisu.lib. MSVC
          # options use dash form: git-bash leaves //X args with colons
          # unconverted (lib.exe saw '//OUT:...' and ignored it), while
          # dash-form options are never mangled.
          cl -nologo -O2 -MD -std:c++17 -DBASISD_SUPPORT_KTX2_ZSTD=1 \
            -I "$SRC" -I "$SRC/encoder" -I "$SRC/transcoder" -I "$SRC/zstd" \
            -c "$SRC/encoder/basisu_wasm_api.cpp" "$SRC/encoder/basisu_wasm_transcoder_api.cpp"
          mkdir -p windows-x64
          lib -nologo "-OUT:windows-x64/basisu.lib" \
            native/build/Release/basisu_encoder.lib basisu_wasm_api.obj basisu_wasm_transcoder_api.obj
          test -f windows-x64/basisu.lib
      - uses: actions/upload-artifact@v4
        with:
          name: libbasisu-windows-x64
          path: windows-x64/basisu.lib
          if-no-files-found: error

      - name: Install c3c
        shell: bash
        run: |
          curl -fsSL -o c3-windows.zip "https://github.com/c3lang/c3c/releases/download/${C3C_RELEASE}/c3-windows.zip"
          unzip -q c3-windows.zip -d "$HOME"
          echo "$(cygpath -w "$HOME/c3")" >> "$GITHUB_PATH"
      - name: Build ktx.dll
        shell: bash
        run: |
          ls -la windows-x64/
          # c3c's -L/-l don't reach lld-link as /libpath:, and lld-link runs
          # from its own cwd — pass a Windows-style absolute path expanded by
          # the runner itself (cygpath output risks a stray \r in the arg).
          # -vv prints the linker invocation for diagnosis.
          c3c dynamic-lib src/ktx/*.c3 src/capi/*.c3 -O2 --no-headers -vv \
            -z '${{ github.workspace }}\windows-x64\basisu.lib' -o windows-x64/ktx
      - name: Smoke-test the C API
        shell: bash
        run: python test/capi_smoke.py windows-x64/ktx.dll
      - uses: actions/upload-artifact@v4
        with:
          name: libktx-windows-x64
          path: |
            windows-x64/ktx.dll
            windows-x64/ktx.lib
          if-no-files-found: error
